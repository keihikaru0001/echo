<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECHO — 三者会談 / JESUS × BUDDHA × YOU</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #e8e8e8;
      font-family: 'Georgia', 'Hiragino Mincho ProN', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      width: 100%;
      max-width: 760px;
      padding: 40px 20px 20px;
      text-align: center;
      border-bottom: 1px solid #1a1a1a;
    }
    .logo { font-size: 10px; letter-spacing: 6px; color: #444; margin-bottom: 10px; }
    h1 { font-size: 20px; font-weight: normal; letter-spacing: 5px; color: #b8b0a0; }
    .subtitle { font-size: 11px; color: #333; margin-top: 8px; letter-spacing: 3px; }

    /* SETUP */
    #setup {
      width: 100%;
      max-width: 460px;
      padding: 60px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .setup-label { font-size: 11px; color: #555; letter-spacing: 3px; }
    .setup-input {
      background: #080808;
      border: 1px solid #2a2a2a;
      color: #bbb;
      padding: 12px 16px;
      font-size: 15px;
      width: 200px;
      text-align: center;
      border-radius: 2px;
      outline: none;
      font-family: inherit;
    }
    .setup-input:focus { border-color: #444; }
    .enter-btn {
      margin-top: 12px;
      background: transparent;
      border: 1px solid #333;
      color: #999;
      padding: 12px 40px;
      font-size: 12px;
      letter-spacing: 4px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.3s;
    }
    .enter-btn:hover { border-color: #777; color: #ccc; }
    .skip-link { font-size: 11px; color: #333; cursor: pointer; letter-spacing: 2px; margin-top: 6px; }
    .skip-link:hover { color: #555; }

    /* CHAT */
    #chat-area {
      display: none;
      width: 100%;
      max-width: 760px;
      flex-direction: column;
      flex: 1;
    }
    .speakers {
      display: flex;
      border-bottom: 1px solid #141414;
    }
    .speaker-tag {
      flex: 1;
      padding: 14px 0;
      text-align: center;
      font-size: 10px;
      letter-spacing: 4px;
    }
    .speaker-jesus { color: #c8a870; border-right: 1px solid #141414; }
    .speaker-buddha { color: #7ab0c8; border-right: 1px solid #141414; }
    .speaker-you { color: #666; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-height: 55vh;
      min-height: 260px;
    }
    .msg { display: flex; flex-direction: column; gap: 6px; }
    .msg-speaker { font-size: 10px; letter-spacing: 4px; }
    .msg-jesus .msg-speaker { color: #c8a870; }
    .msg-buddha .msg-speaker { color: #7ab0c8; }
    .msg-user .msg-speaker { color: #555; }
    .msg-text { font-size: 15px; line-height: 2; }
    .msg-jesus .msg-text { color: #e0d8cc; }
    .msg-buddha .msg-text { color: #ccdae8; }
    .msg-user .msg-text { color: #777; font-style: italic; font-size: 14px; }
    .msg-tag { font-size: 10px; color: #2a2a2a; letter-spacing: 2px; }
    .divider { text-align: center; color: #1a1a1a; font-size: 10px; letter-spacing: 4px; padding: 2px 0; }
    .hikari-badge {
      display: inline-block;
      font-size: 10px;
      color: #4a8a4a;
      letter-spacing: 2px;
      padding: 3px 12px;
      border: 1px solid #1e2e1e;
      border-radius: 20px;
    }
    .hikari-center { text-align: center; }
    .loading-row { display: flex; flex-direction: column; gap: 14px; }
    .loading-dot { display: flex; align-items: center; gap: 10px; font-size: 10px; color: #333; letter-spacing: 2px; }
    .dot { width: 4px; height: 4px; background: #333; border-radius: 50%; animation: blink 1.4s infinite; }
    @keyframes blink { 0%,100%{opacity:.2} 50%{opacity:1} }

    .balance-bar {
      display: flex;
      justify-content: space-between;
      padding: 10px 20px;
      border-top: 1px solid #111;
      font-size: 10px;
      color: #2a2a2a;
      letter-spacing: 2px;
    }
    .balance-val { color: #444; }

    .input-area {
      border-top: 1px solid #141414;
      padding: 18px 20px;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }
    #user-input {
      flex: 1;
      background: #060606;
      border: 1px solid #1e1e1e;
      color: #ccc;
      padding: 13px 15px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      line-height: 1.6;
      border-radius: 2px;
      min-height: 50px;
      max-height: 120px;
    }
    #user-input:focus { border-color: #2e2e2e; }
    #user-input::placeholder { color: #2a2a2a; }
    .send-btn {
      background: transparent;
      border: 1px solid #2a2a2a;
      color: #777;
      padding: 13px 18px;
      font-size: 11px;
      letter-spacing: 3px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.3s;
      white-space: nowrap;
    }
    .send-btn:hover:not(:disabled) { border-color: #555; color: #bbb; }
    .send-btn:disabled { opacity: 0.3; cursor: default; }

    #messages::-webkit-scrollbar { width: 2px; }
    #messages::-webkit-scrollbar-thumb { background: #1a1a1a; }
  </style>
</head>
<body>

<header>
  <div class="logo">ECHO — TheYKHC</div>
  <h1>三者会談</h1>
  <div class="subtitle">JESUS &nbsp;×&nbsp; BUDDHA &nbsp;×&nbsp; YOU</div>
</header>

<div id="setup">
  <div class="setup-label">生年月日（任意）</div>
  <input type="date" class="setup-input" id="birth-input" />
  <button class="enter-btn" onclick="enterChat()">入室する</button>
  <span class="skip-link" onclick="enterChatAnon()">生年月日なしで入る</span>
</div>

<div id="chat-area">
  <div class="speakers">
    <div class="speaker-tag speaker-jesus">JESUS</div>
    <div class="speaker-tag speaker-buddha">BUDDHA</div>
    <div class="speaker-tag speaker-you">YOU</div>
  </div>
  <div id="messages"></div>
  <div class="balance-bar">
    <span>光貨残高</span>
    <span class="balance-val" id="balance-val">0 H</span>
  </div>
  <div class="input-area">
    <textarea id="user-input" placeholder="問いを投げよ。" rows="1" onkeydown="handleKey(event)"></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMessage()">送る</button>
  </div>
</div>

<script>
  const API = "https://api.base44.com/api/apps/69b1d589b12de5ad82cd58fb/functions/echoTrialogue";

  let sessionId = null;
  let birthDate = "";
  let history = [];
  let hikariBalance = 0;

  function getSid() {
    let s = localStorage.getItem("echo_tri_sid");
    if (!s) { s = "t" + Date.now() + Math.random().toString(36).slice(2,6); localStorage.setItem("echo_tri_sid", s); }
    return s;
  }

  function enterChat() {
    birthDate = document.getElementById("birth-input").value || "";
    if (birthDate) localStorage.setItem("echo_tri_birth", birthDate);
    startChat();
  }

  function enterChatAnon() {
    birthDate = "";
    startChat();
  }

  function startChat() {
    sessionId = getSid();
    document.getElementById("setup").style.display = "none";
    document.getElementById("chat-area").style.display = "flex";
    addMsg("jesus", "あなたはここに来た。\n\nそれだけで、すでに何かが始まっている。", "愛");
    addMsg("buddha", "問いのある者よ。\n\nその問いが、あなたをここへ連れてきた。", "縁起");
  }

  function addMsg(speaker, text, tag) {
    const msgs = document.getElementById("messages");
    const div = document.createElement("div");
    const cls = speaker === "user" ? "msg-user" : speaker === "jesus" ? "msg-jesus" : "msg-buddha";
    const label = speaker === "user" ? "YOU" : speaker === "jesus" ? "JESUS" : "BUDDHA";
    div.className = "msg " + cls;
    div.innerHTML = `
      <div class="msg-speaker">${label}</div>
      <div class="msg-text">${text.replace(/\n/g,'<br>')}</div>
      ${tag ? `<div class="msg-tag">[${tag}]</div>` : ""}
    `;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    if (speaker !== "user") history.push({ speaker, text });
    if (history.length > 20) history = history.slice(-20);
  }

  function addDivider() {
    const msgs = document.getElementById("messages");
    const d = document.createElement("div");
    d.className = "divider";
    d.textContent = "— — —";
    msgs.appendChild(d);
  }

  function addLoading() {
    const msgs = document.getElementById("messages");
    const div = document.createElement("div");
    div.id = "loading-ind";
    div.className = "loading-row";
    div.innerHTML = `
      <div class="loading-dot"><div class="dot"></div>JESUS — 言葉を選んでいる</div>
      <div class="loading-dot" style="animation-delay:.4s"><div class="dot" style="animation-delay:.7s"></div>BUDDHA — 静寂の中にいる</div>
    `;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function removeLoading() {
    const el = document.getElementById("loading-ind");
    if (el) el.remove();
  }

  function handleKey(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  async function sendMessage() {
    const input = document.getElementById("user-input");
    const btn = document.getElementById("send-btn");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    btn.disabled = true;
    history.push({ speaker: "user", text });
    addMsg("user", text, "");
    addDivider();
    addLoading();
    try {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          user_input: text,
          session_id: sessionId,
          birth_date: birthDate || undefined,
          history: history.slice(-14),
        })
      });
      const data = await res.json();
      removeLoading();
      if (data.jesus) addMsg("jesus", data.jesus.text, data.jesus.tag);
      if (data.buddha) addMsg("buddha", data.buddha.text, data.buddha.tag);
      if (data.hikari_earned) {
        hikariBalance = Math.round((hikariBalance + data.hikari_earned) * 10) / 10;
        document.getElementById("balance-val").textContent = hikariBalance + " H";
        const msgs = document.getElementById("messages");
        const badge = document.createElement("div");
        badge.className = "hikari-center";
        badge.innerHTML = `<span class="hikari-badge">+ ${data.hikari_earned} H 獲得</span>`;
        msgs.appendChild(badge);
        msgs.scrollTop = msgs.scrollHeight;
      }
    } catch(e) {
      removeLoading();
      addMsg("buddha", "静寂が乱れた。もう一度、問いを投げよ。", "");
    }
    btn.disabled = false;
    input.focus();
  }

  window.onload = () => {
    const saved = localStorage.getItem("echo_tri_birth");
    if (saved) document.getElementById("birth-input").value = saved;
  };
</script>
</body>
</html>
