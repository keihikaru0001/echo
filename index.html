<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECHO — アーティストと言葉で共鳴する</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  color: #fff;
  font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
  min-height: 100vh;
}

#home {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 16px;
}
.echo-title { font-size: 42px; font-weight: 700; letter-spacing: 10px; margin-bottom: 8px; }
.echo-sub { color: #444; font-size: 12px; letter-spacing: 3px; margin-bottom: 48px; }
.artist-list { width: 100%; max-width: 420px; }
.artist-card {
  width: 100%; display: flex; align-items: center; gap: 16px;
  background: #0d0d0d; border: 1px solid #1a1a1a; border-radius: 14px;
  padding: 16px; margin-bottom: 12px; cursor: pointer; color: #fff;
  text-align: left; transition: border-color 0.2s;
}
.artist-card:hover { border-color: #333; }
.artist-avatar {
  width: 50px; height: 50px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700; flex-shrink: 0;
}
.artist-name { font-weight: 600; font-size: 15px; margin-bottom: 3px; }
.artist-tagline { color: #555; font-size: 12px; }
.home-footer { color: #222; font-size: 11px; margin-top: 40px; text-align: center; line-height: 1.8; }

#chat { display: none; flex-direction: column; height: 100vh; }
.chat-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid #111; flex-shrink: 0;
}
.chat-header-center { display: flex; align-items: center; gap: 8px; }
.chat-avatar-sm {
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700;
}
.chat-artist-name { font-weight: 600; font-size: 14px; }
.btn-back, .btn-trail {
  background: none; border: none; color: #444; cursor: pointer;
  font-size: 13px; padding: 4px 8px;
}
.btn-back:hover, .btn-trail:hover { color: #888; }

.status-bar {
  padding: 7px 16px; background: #050505; border-bottom: 1px solid #0a0a0a;
  display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
}
.emotion-label { font-size: 11px; color: #444; }
.hikari-label { font-size: 12px; color: #b8960c; }
.bio-bar {
  padding: 5px 16px; background: #050505; border-bottom: 1px solid #0a0a0a;
  display: flex; gap: 16px; flex-shrink: 0;
}
.bio-item { font-size: 10px; color: #333; }
.bio-item span { color: #555; margin-left: 4px; }
.bio-high { color: #5b21b6 !important; }
.bio-low { color: #4b1111 !important; }

.birth-bar {
  padding: 12px 16px; background: #080808; border-bottom: 1px solid #111; flex-shrink: 0;
}
.birth-bar p { font-size: 11px; color: #444; margin-bottom: 8px; }
.birth-bar-row { display: flex; gap: 8px; }
.birth-input {
  flex: 1; background: #111; border: 1px solid #222; border-radius: 8px;
  padding: 7px 12px; color: #fff; font-size: 13px; outline: none;
}
.birth-input:focus { border-color: #333; }
.btn-set {
  padding: 7px 14px; background: #5b21b6; border: none; border-radius: 8px;
  color: #fff; font-size: 12px; cursor: pointer;
}
.btn-skip {
  padding: 7px 10px; background: none; border: none; color: #444; font-size: 12px; cursor: pointer;
}

.messages {
  flex: 1; overflow-y: auto; padding: 20px 16px;
  display: flex; flex-direction: column; gap: 16px;
}
.msg-row { display: flex; gap: 8px; }
.msg-row.fan { justify-content: flex-end; }
.msg-row.artist { justify-content: flex-start; }
.msg-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; flex-shrink: 0; margin-top: 2px;
}
.msg-bubble {
  max-width: 72%; padding: 12px 16px; border-radius: 16px;
  font-size: 13px; line-height: 1.75; white-space: pre-wrap;
}
.msg-bubble.fan { background: #3b0764; border-radius: 16px 16px 4px 16px; }
.msg-bubble.artist { background: #111; border-radius: 16px 16px 16px 4px; }
.msg-song { color: #6d28d9; font-size: 11px; margin-top: 6px; }
.msg-hikari { color: #b8960c; font-size: 10px; margin-top: 4px; }

.typing-row { display: flex; gap: 8px; align-items: center; }
.typing-dots { display: flex; gap: 4px; padding: 14px 16px; background: #111; border-radius: 16px 16px 16px 4px; }
.typing-dots span {
  width: 6px; height: 6px; background: #444; border-radius: 50%;
  animation: blink 1.2s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }

.input-area {
  padding: 12px 16px; border-top: 1px solid #111; background: #000;
  display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0;
}
.msg-input {
  flex: 1; background: #0d0d0d; border: 1px solid #1a1a1a; border-radius: 20px;
  padding: 10px 16px; color: #fff; font-size: 14px; resize: none;
  outline: none; font-family: inherit; max-height: 100px; line-height: 1.5;
}
.msg-input:focus { border-color: #333; }
.btn-send {
  width: 38px; height: 38px; background: #5b21b6; border: none; border-radius: 50%;
  color: #fff; font-size: 18px; cursor: pointer; display: flex;
  align-items: center; justify-content: center; flex-shrink: 0;
  transition: background 0.2s;
}
.btn-send:hover { background: #6d28d9; }
.btn-send:disabled { background: #111; cursor: default; }

#trail { display: none; flex-direction: column; height: 100vh; }
.trail-header {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-bottom: 1px solid #111; flex-shrink: 0;
}
.trail-items { flex: 1; overflow-y: auto; padding: 16px; }
.trail-item {
  border: 1px solid #111; border-radius: 12px;
  padding: 16px; margin-bottom: 12px;
}
.trail-num { font-size: 11px; color: #444; margin-bottom: 8px; }
.trail-fan-text { color: #555; font-size: 13px; margin-bottom: 8px; font-style: italic; }
.trail-artist-text { color: #ccc; font-size: 13px; line-height: 1.75; white-space: pre-wrap; }
.trail-song { color: #6d28d9; font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>

<!-- ホーム -->
<div id="home">
  <div style="font-size:44px;margin-bottom:16px;">✦</div>
  <div class="echo-title">ECHO</div>
  <div class="echo-sub">アーティストと、言葉で共鳴する</div>
  <div class="artist-list" id="artistList">
    <div style="color:#333;text-align:center;font-size:13px;padding:20px;">読み込み中...</div>
  </div>
  <div class="home-footer">
    ここでの対話は、あなただけに届く。<br>同じ言葉は、二度と返さない。
  </div>
</div>

<!-- チャット -->
<div id="chat">
  <div class="chat-header">
    <button class="btn-back" onclick="goHome()">← 戻る</button>
    <div class="chat-header-center">
      <div class="chat-avatar-sm" id="chatAvatar"></div>
      <div class="chat-artist-name" id="chatName"></div>
    </div>
    <button class="btn-trail" onclick="showTrail()">軌跡</button>
  </div>
  <div class="status-bar">
    <span class="emotion-label" id="emotionLabel">——</span>
    <span class="hikari-label" id="hikariLabel">✦ 0 光貨</span>
  </div>
  <div class="bio-bar" id="bioBar" style="display:none;">
    <span class="bio-item">体 <span id="bioPhy">—</span></span>
    <span class="bio-item">心 <span id="bioEmo">—</span></span>
    <span class="bio-item">頭 <span id="bioInt">—</span></span>
  </div>
  <div class="birth-bar" id="birthBar">
    <p>生年月日を教えてくれると、バイオリズムで共鳴できる</p>
    <div class="birth-bar-row">
      <input type="date" class="birth-input" id="birthInput">
      <button class="btn-set" onclick="setBirth()">設定</button>
      <button class="btn-skip" onclick="skipBirth()">スキップ</button>
    </div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <textarea class="msg-input" id="msgInput" rows="1" placeholder="言葉を送る..." onkeydown="onKeyDown(event)" oninput="autoResize(this)"></textarea>
    <button class="btn-send" id="sendBtn" onclick="sendMessage()">↑</button>
  </div>
</div>

<!-- 軌跡 -->
<div id="trail">
  <div class="trail-header">
    <button class="btn-back" onclick="showChat()">← 戻る</button>
    <span style="font-weight:600;font-size:14px;">あなたの軌跡</span>
  </div>
  <div class="trail-items" id="trailItems"></div>
</div>

<script>
const BASE = "https://base44.app/api/apps/69b1d589b12de5ad82cd58fb";

let artists = [];
let selectedArtist = null;
let sessionId = "echo_" + Date.now();
let birthDate = null;
let hikariTotal = 0;
let isLoading = false;

const AVATAR_COLORS = [
  ["Key（TYPE-1）", "linear-gradient(135deg,#1e3a5f,#2563eb)"],
  ["Sol（TYPE-2）", "linear-gradient(135deg,#7c2d12,#f97316)"],
  ["Luna（TYPE-3）", "linear-gradient(135deg,#1e1b4b,#7c3aed)"],
  ["Key（圭光る）", "linear-gradient(135deg,#1e3a5f,#2563eb)"],
  ["Sol（太陽", "linear-gradient(135deg,#7c2d12,#f97316)"],
  ["Luna（月", "linear-gradient(135deg,#1e1b4b,#7c3aed)"],
  ["Ren", "linear-gradient(135deg,#1a1a2e,#8a5cf6)"],
  ["圭光る", "linear-gradient(135deg,#064e3b,#10b981)"],
];

function getAvatarColor(name) {
  if (!name) return "linear-gradient(135deg,#7c3aed,#2563eb)";
  for (const [key, val] of AVATAR_COLORS) {
    if (name.includes(key)) return val;
  }
  return "linear-gradient(135deg,#7c3aed,#2563eb)";
}

async function loadArtists() {
  try {
    const res = await fetch(BASE + "/functions/getArtists", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status: "active" })
    });
    const data = await res.json();
    artists = Array.isArray(data) ? data : (data.records || []);
    renderArtists();
  } catch(e) {
    document.getElementById("artistList").innerHTML =
      '<div style="color:#333;text-align:center;padding:20px;">読み込みに失敗しました</div>';
  }
}

function renderArtists() {
  const list = document.getElementById("artistList");
  if (!artists.length) {
    list.innerHTML = '<div style="color:#333;text-align:center;">アーティストがいません</div>';
    return;
  }
  list.innerHTML = artists.map(a => `
    <button class="artist-card" onclick="selectArtist('${a.id}')">
      <div class="artist-avatar" style="background:${getAvatarColor(a.display_name)}">
        ${esc((a.display_name||'?')[0])}
      </div>
      <div>
        <div class="artist-name">${esc(a.display_name||'')}</div>
        <div class="artist-tagline">${esc(a.tagline||'')}</div>
      </div>
    </button>
  `).join('');
}

function selectArtist(id) {
  selectedArtist = artists.find(a => a.id === id);
  if (!selectedArtist) return;

  sessionId = "echo_" + Date.now();
  hikariTotal = 0;
  birthDate = null;

  document.getElementById("chatName").textContent = selectedArtist.display_name || '';
  const color = getAvatarColor(selectedArtist.display_name);
  const av = document.getElementById("chatAvatar");
  av.style.background = color;
  av.textContent = (selectedArtist.display_name||'?')[0];

  document.getElementById("hikariLabel").textContent = "✦ 0 光貨";
  document.getElementById("emotionLabel").textContent = "——";
  document.getElementById("birthBar").style.display = "block";
  document.getElementById("birthInput").value = "";

  document.getElementById("messages").innerHTML = "";
  addArtistMsg("……来たね。\nここは静かな場所だ。\nあなたの言葉を、ちゃんと聞く。");

  showView("chat");
}

function setBirth() {
  const val = document.getElementById("birthInput").value;
  if (!val) return;
  birthDate = val;
  document.getElementById("birthBar").style.display = "none";
}

function skipBirth() {
  document.getElementById("birthBar").style.display = "none";
}

function addFanMsg(text) {
  const msgs = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg-row fan";
  div.innerHTML = `<div class="msg-bubble fan">${esc(text)}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function addArtistMsg(text, song, hikari) {
  const msgs = document.getElementById("messages");
  const color = getAvatarColor(selectedArtist?.display_name);
  const initial = (selectedArtist?.display_name||'?')[0];
  const div = document.createElement("div");
  div.className = "msg-row artist";
  div.innerHTML = `
    <div class="msg-avatar" style="background:${color}">${esc(initial)}</div>
    <div style="display:flex;flex-direction:column;align-items:flex-start;">
      <div class="msg-bubble artist">${esc(text)}</div>
      ${song ? `<div class="msg-song">♪ ${esc(song)}</div>` : ""}
      ${hikari ? `<div class="msg-hikari">+${hikari} 光貨</div>` : ""}
    </div>
  `;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function addTyping() {
  const msgs = document.getElementById("messages");
  const color = getAvatarColor(selectedArtist?.display_name);
  const initial = (selectedArtist?.display_name||'?')[0];
  const div = document.createElement("div");
  div.className = "msg-row artist";
  div.id = "typingRow";
  div.innerHTML = `
    <div class="msg-avatar" style="background:${color}">${esc(initial)}</div>
    <div class="typing-dots"><span></span><span></span><span></span></div>
  `;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById("typingRow");
  if (t) t.remove();
}

async function sendMessage() {
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if (!text || isLoading) return;

  input.value = "";
  autoResize(input);
  isLoading = true;
  document.getElementById("sendBtn").disabled = true;

  addFanMsg(text);
  addTyping();

  try {
    const res = await fetch(BASE + "/functions/echoChat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        artist_id: selectedArtist.id,
        user_input: text,
        session_id: sessionId,
        birth_date: birthDate || null,
      })
    });
    const data = await res.json();
    removeTyping();

    if (data.output) {
      addArtistMsg(data.output, data.resonant_song?.title, data.hikari_earned);
      if (data.emotion_detected) {
        document.getElementById("emotionLabel").textContent = data.emotion_detected;
      }
      if (data.hikari_earned) {
        hikariTotal += data.hikari_earned;
        document.getElementById("hikariLabel").textContent = `✦ ${hikariTotal} 光貨`;
      }
      if (data.biorhythm && birthDate) {
        const bio = data.biorhythm;
        const fmt = (v) => v > 0.3 ? `+${(v*100).toFixed(0)}%` : v < -0.3 ? `${(v*100).toFixed(0)}%` : `${(v*100).toFixed(0)}%`;
        const cls = (v) => v > 0.3 ? 'bio-high' : v < -0.3 ? 'bio-low' : '';
        document.getElementById("bioPhy").textContent = fmt(bio.physical);
        document.getElementById("bioPhy").className = cls(bio.physical);
        document.getElementById("bioEmo").textContent = fmt(bio.emotional);
        document.getElementById("bioEmo").className = cls(bio.emotional);
        document.getElementById("bioInt").textContent = fmt(bio.intellectual);
        document.getElementById("bioInt").className = cls(bio.intellectual);
        document.getElementById("bioBar").style.display = "flex";
      }
    } else {
      addArtistMsg("……うまく届かなかった。もう一度。");
    }
  } catch(e) {
    removeTyping();
    addArtistMsg("……うまく届かなかった。もう一度。");
  }

  isLoading = false;
  document.getElementById("sendBtn").disabled = false;
}

function onKeyDown(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 100) + "px";
}

async function showTrail() {
  const items = document.getElementById("trailItems");
  items.innerHTML = '<div style="color:#333;text-align:center;padding:32px;">読み込み中...</div>';
  showView("trail");

  try {
    const res = await fetch(BASE + "/functions/getFanTrail", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, artist_id: selectedArtist.id })
    });
    const data = await res.json();
    const records = (Array.isArray(data) ? data : (data.records || []))
      .sort((a,b) => new Date(a.created_date) - new Date(b.created_date));

    if (!records.length) {
      items.innerHTML = '<div style="color:#333;text-align:center;padding:48px;">まだ対話がない</div>';
      return;
    }
    items.innerHTML = records.map((h, i) => `
      <div class="trail-item">
        <div class="trail-num">#${i+1}${h.emotion_detected ? " — " + esc(h.emotion_detected) : ""}</div>
        <div class="trail-fan-text">「${esc(h.user_input||'')}」</div>
        <div class="trail-artist-text">${esc(h.generated_output||'')}</div>
        ${h.resonant_song_title ? `<div class="trail-song">♪ ${esc(h.resonant_song_title)}</div>` : ""}
      </div>
    `).join('');
  } catch(e) {
    items.innerHTML = '<div style="color:#333;text-align:center;padding:32px;">読み込みに失敗しました</div>';
  }
}

function showView(id) {
  ["home","chat","trail"].forEach(v => {
    const el = document.getElementById(v);
    if (v === id) {
      el.style.display = "flex";
      el.style.flexDirection = "column";
    } else {
      el.style.display = "none";
    }
  });
}

function goHome() { showView("home"); }
function showChat() { showView("chat"); }

function esc(str) {
  return (str||'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/\n/g,'<br>');
}

loadArtists();
</script>
</body>
</html>
