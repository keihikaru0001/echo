<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECHO — 今日のあなたへ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #faf9f6; color: #222; font-family: 'Noto Sans JP', sans-serif; min-height: 100vh; }

  .header {
    background: linear-gradient(135deg, #fff8f0 0%, #fef0f8 50%, #f0f4ff 100%);
    border-bottom: 1px solid #ece8e0;
    padding: 32px 20px 28px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: "✦ ✦ ✦";
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    color: #d4a0c0; font-size: 10px; letter-spacing: 8px;
  }
  .header-title { font-family: 'Playfair Display', serif; font-size: 36px; font-style: italic; color: #3a2a4a; letter-spacing: 4px; margin-bottom: 4px; }
  .header-sub { font-size: 11px; color: #a08098; letter-spacing: 4px; text-transform: uppercase; }

  .container { max-width: 520px; margin: 0 auto; padding: 20px 24px 60px; }

  .birth-card {
    background: #fff; border: 1px solid #ece8e0; border-radius: 20px;
    padding: 36px 28px; text-align: center;
    box-shadow: 0 4px 24px rgba(180,140,160,0.08); margin-top: 20px;
  }
  .birth-icon { font-size: 36px; margin-bottom: 12px; }
  .birth-label { font-size: 13px; color: #9080a0; letter-spacing: 3px; margin-bottom: 20px; text-transform: uppercase; }
  .birth-input {
    background: #faf8fc; border: 1px solid #ddd8e8; color: #333;
    padding: 14px 20px; border-radius: 50px; font-size: 16px; width: 220px;
    text-align: center; outline: none; display: block; margin: 0 auto 20px;
    font-family: 'Noto Sans JP', sans-serif; transition: border-color 0.2s;
  }
  .birth-input:focus { border-color: #c8a0b8; }
  .birth-btn {
    background: linear-gradient(135deg, #c8a0b8, #a0b8d8); color: #fff; border: none;
    padding: 14px 36px; border-radius: 50px; font-size: 13px; font-weight: 700;
    cursor: pointer; letter-spacing: 3px; font-family: 'Noto Sans JP', sans-serif;
    transition: opacity 0.2s, transform 0.1s;
    box-shadow: 0 4px 16px rgba(180,140,200,0.3);
  }
  .birth-btn:hover { opacity: 0.88; transform: translateY(-1px); }
  .birth-note { font-size: 11px; color: #bbb; margin-top: 16px; letter-spacing: 1px; }

  .result { display: none; animation: fadeIn 0.9s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  .moon-card {
    background: linear-gradient(135deg, #fff8f0, #fef0f8);
    border: 1px solid #f0e4ec; border-radius: 20px; padding: 28px 24px 20px;
    text-align: center; margin-top: 20px; box-shadow: 0 2px 16px rgba(180,140,160,0.08);
  }
  .moon-emoji { font-size: 52px; margin-bottom: 6px; }
  .moon-name { font-family: 'Playfair Display', serif; font-size: 18px; color: #6a4a7a; letter-spacing: 2px; margin-bottom: 4px; }
  .moon-date { font-size: 11px; color: #bba8c8; letter-spacing: 2px; }
  .moon-msg { font-size: 13px; color: #8a7090; margin-top: 12px; line-height: 1.9; font-style: italic; }

  .num-card {
    background: #fff; border: 1px solid #ece8e0; border-radius: 16px;
    padding: 20px 24px; margin-top: 16px; display: flex; justify-content: center;
    gap: 40px; box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }
  .num-item { text-align: center; }
  .num-val { font-family: 'Playfair Display', serif; font-size: 32px; color: #5a3a6a; line-height: 1; }
  .num-lbl { font-size: 10px; color: #bbb; letter-spacing: 2px; margin-top: 4px; text-transform: uppercase; }

  .bio-card {
    background: #fff; border: 1px solid #ece8e0; border-radius: 16px;
    padding: 20px 24px; margin-top: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }
  .bio-title { font-size: 10px; color: #bbb; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 16px; text-align: center; }
  .bio-row { display: flex; align-items: center; margin-bottom: 12px; gap: 12px; }
  .bio-label { font-size: 12px; color: #9080a0; width: 24px; text-align: right; }
  .bio-track { flex: 1; height: 6px; background: #f0eaf4; border-radius: 3px; position: relative; overflow: hidden; }
  .bio-fill { height: 100%; border-radius: 3px; position: absolute; top: 0; transition: width 1.2s ease, left 1.2s ease; }
  .bio-val { font-size: 11px; color: #aaa; width: 36px; text-align: right; }

  /* キャラカード */
  .chara-card {
    border-radius: 20px; padding: 0; margin-top: 16px;
    overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    border: 1px solid #ece8e0;
  }
  .chara-img-wrap { position: relative; width: 100%; }
  .chara-img { width: 100%; height: 280px; object-fit: cover; object-position: top; display: block; }
  .chara-overlay {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, rgba(20,10,30,0.85) 0%, transparent 100%);
    padding: 24px 20px 16px;
  }
  .chara-badge {
    display: inline-block; padding: 3px 14px; border-radius: 20px;
    font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
    color: #fff; margin-bottom: 8px;
  }
  .chara-name { font-family: 'Playfair Display', serif; font-size: 26px; color: #fff; letter-spacing: 2px; }
  .chara-body { padding: 20px 24px 24px; background: #fff; }
  .chara-msg { font-size: 14px; color: #555; line-height: 2; font-style: italic; }

  .lyric-card {
    background: #fff; border: 1px solid #ece8e0; border-radius: 20px;
    padding: 28px 28px 24px; margin-top: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }
  .lyric-song { font-size: 11px; color: #c8a0b8; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 16px; text-align: center; }
  .lyric-text { font-size: 14px; line-height: 2.4; color: #444; white-space: pre-line; text-align: center; }
  .lyric-sig { text-align: right; font-family: 'Playfair Display', serif; font-style: italic; font-size: 13px; color: #bba8c8; margin-top: 16px; }

  .reset-wrap { text-align: center; margin-top: 32px; }
  .reset-btn {
    background: none; border: 1px solid #ddd; color: #aaa;
    padding: 10px 24px; border-radius: 30px; font-size: 11px;
    cursor: pointer; letter-spacing: 2px; font-family: 'Noto Sans JP', sans-serif; transition: all 0.2s;
  }
  .reset-btn:hover { border-color: #c8a0b8; color: #9080a0; }

  .footer { text-align: center; padding: 32px 20px; font-size: 10px; color: #ccc; letter-spacing: 3px; text-transform: uppercase; }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">ECHO</div>
  <div class="header-sub">今日のあなたへ</div>
</div>

<div class="container">

  <div class="birth-card" id="birthSection">
    <div class="birth-icon">🌸</div>
    <div class="birth-label">あなたの生年月日</div>
    <input type="date" class="birth-input" id="birthInput" max="2010-01-01" min="1930-01-01">
    <button class="birth-btn" onclick="submit()">今日のあなたへ</button>
    <div class="birth-note">生年月日はあなたのデバイスにのみ保存されます</div>
  </div>

  <div class="result" id="result">

    <div class="moon-card">
      <div class="moon-emoji" id="moonEmoji"></div>
      <div class="moon-name" id="moonName"></div>
      <div class="moon-date" id="moonDate"></div>
      <div class="moon-msg" id="moonMsg"></div>
    </div>

    <div class="num-card">
      <div class="num-item">
        <div class="num-val" id="lifeNum"></div>
        <div class="num-lbl">Life Number</div>
      </div>
      <div class="num-item" style="border-left:1px solid #f0eaf4; padding-left:40px;">
        <div class="num-val" id="todayNum"></div>
        <div class="num-lbl">Today's Number</div>
      </div>
    </div>

    <div class="bio-card">
      <div class="bio-title">Biorhythm</div>
      <div class="bio-row">
        <div class="bio-label">体</div>
        <div class="bio-track"><div class="bio-fill" id="bioP"></div></div>
        <div class="bio-val" id="bioPhysical"></div>
      </div>
      <div class="bio-row">
        <div class="bio-label">心</div>
        <div class="bio-track"><div class="bio-fill" id="bioE"></div></div>
        <div class="bio-val" id="bioEmotional"></div>
      </div>
      <div class="bio-row">
        <div class="bio-label">知</div>
        <div class="bio-track"><div class="bio-fill" id="bioI"></div></div>
        <div class="bio-val" id="bioIntellectual"></div>
      </div>
    </div>

    <!-- キャラカード -->
    <div class="chara-card" id="charaCard">
      <div class="chara-img-wrap">
        <img class="chara-img" id="charaImg" src="" alt="">
        <div class="chara-overlay">
          <div class="chara-badge" id="charaBadge"></div>
          <div class="chara-name" id="charaName"></div>
        </div>
      </div>
      <div class="chara-body">
        <div class="chara-msg" id="charaMsg"></div>
      </div>
    </div>

    <div class="lyric-card">
      <div class="lyric-song" id="lyricSong"></div>
      <div class="lyric-text" id="lyricText"></div>
      <div class="lyric-sig" id="lyricSig"></div>
    </div>

    <div class="reset-wrap">
      <button class="reset-btn" onclick="reset()">別の日付で見る</button>
    </div>

  </div>
</div>

<div class="footer">✦ ECHO by TheYKHC ✦</div>

<script>
const KEY_IMG  = "https://media.base44.com/images/public/69b1d589b12de5ad82cd58fb/17adc90b2_generated_image.png";
const SOL_IMG  = "https://media.base44.com/images/public/69b1d589b12de5ad82cd58fb/22147f13d_generated_image.png";
const LUNA_IMG = "https://media.base44.com/images/public/69b1d589b12de5ad82cd58fb/f7dd9d5a0_generated_image.png";
const REN_IMG  = LUNA_IMG; // Renはとりあえずルナ画像
const KEI_IMG  = SOL_IMG;  // 圭光るはとりあえずSol画像

function calcBio(birth) {
  const days = Math.floor((Date.now() - new Date(birth).getTime()) / 86400000);
  return {
    physical:     Math.round(Math.sin(2 * Math.PI * days / 23) * 100),
    emotional:    Math.round(Math.sin(2 * Math.PI * days / 28) * 100),
    intellectual: Math.round(Math.sin(2 * Math.PI * days / 33) * 100),
  };
}

function getMoon() {
  const cycle = (Date.now() / 86400000) % 29.53;
  if (cycle < 1.5)  return { e: "🌑", n: "新月",     m: "種を蒔く日。静かに意図を立てろ。" };
  if (cycle < 7.5)  return { e: "🌒", n: "三日月",   m: "動き出しの波に乗れ。小さくても前へ。" };
  if (cycle < 14)   return { e: "🌓", n: "上弦の月", m: "迷いがあるなら、今日が決断の日だ。" };
  if (cycle < 15.5) return { e: "🌕", n: "満月",     m: "感情が満ちる。解放して手放せ。" };
  if (cycle < 22)   return { e: "🌖", n: "十六夜",   m: "受け取る時期。焦らなくていい。" };
  if (cycle < 28)   return { e: "🌘", n: "下弦の月", m: "手放して整える。次への準備だ。" };
  return { e: "🌑", n: "晦日月", m: "静寂の中に次の光がある。" };
}

function calcLife(birth) {
  let s = birth.replace(/-/g,"").split("").map(Number).reduce((a,b)=>a+b,0);
  while (s > 9 && s !== 11 && s !== 22) s = s.toString().split("").map(Number).reduce((a,b)=>a+b,0);
  return s;
}

function getTodayNum() {
  const t = new Date();
  let s = (t.getFullYear().toString() + (t.getMonth()+1) + t.getDate()).split("").map(Number).reduce((a,b)=>a+b,0);
  while (s > 9) s = s.toString().split("").map(Number).reduce((a,b)=>a+b,0);
  return s;
}

function getMode(bio) {
  const { physical: p, emotional: e, intellectual: i } = bio;
  const avg = (p + e + i) / 3;
  if (e < -40 && p < 0) return "heal";
  if (e < -40) return "heal";
  if (p < -40 && i < -40) return "heal";
  if (avg > 40) return "peak";
  if (p > 40 && e < 20) return "push";
  if (i < -30) return "push";
  if (e > 40) return "celebrate";
  return "neutral";
}

const MODES = {
  push:      { artist: "Sol（TYPE-2）",  label: "行動の日",  color: "#c09030", img: SOL_IMG,  msg: "「頭は要らない。体が動いてる。進め。」" },
  heal:      { artist: "Ren（レン）",    label: "癒しの日",  color: "#7060a8", img: REN_IMG,  msg: "「今日は何も要求しない。ただここにいる。」" },
  peak:      { artist: "圭光る",         label: "ピークの日", color: "#2878a8", img: KEI_IMG,  msg: "「今日は文明が動く日だ。」" },
  celebrate: { artist: "Luna（TYPE-3）", label: "共鳴の日",  color: "#a84070", img: LUNA_IMG, msg: "「感情が満ちている。その波を記録しておけ。」" },
  neutral:   { artist: "Key（TYPE-1）",  label: "思索の日",  color: "#606878", img: KEY_IMG,  msg: "「静かな日だ。問いを立てるのに最適。」" },
};

const LYRICS = {
  push:      { title: "止まるな",    lines: "考えるな、今日は体が知っている\n頭が黙れ、足が動いている\n\n一歩が光になる\n一言が歴史になる\n今日だけの炎を\n誰かのために燃やせ\n\n止まるな\nお前が止まったら、誰が動く" },
  heal:      { title: "ここにいる",  lines: "今日は何もしなくていい\nただ、ここにいてくれ\n\n言葉はいらない\n涙もいらない\nただ、呼吸するだけで\n今日はそれでいい\n\nあなたはここにいる\nそれだけで、十分だ" },
  peak:      { title: "文明が動く朝", lines: "今日、お前の細胞が叫んでいる\nこの感覚を逃すな\n\n身体は満ちた\n魂は満ちた\nあとは動くだけだ\n\n文明は一人の覚悟から生まれる\n今日がその日だ" },
  celebrate: { title: "波を刻め",    lines: "感情が満ちている\nこの波を無駄にするな\n\nその喜びを誰かに渡せ\nその愛を言葉にしろ\n今日だけの光を\n刻め、刻め、刻め" },
  neutral:   { title: "問いの種",    lines: "静かな朝だ\n今日は考える日\n\n一つだけ問いを立てろ\n\n答えはいらない\n問いが種になる\n種が根になる\n根が文明になる" },
};

function setBioBar(id, fillId, val) {
  const sign = val >= 0 ? "+" : "";
  document.getElementById(id).textContent = sign + val;
  const fill = document.getElementById(fillId);
  const pct = Math.abs(val) / 2;
  fill.style.width = pct + "%";
  fill.style.left = val >= 0 ? "50%" : (50 - pct) + "%";
  fill.style.background = val >= 0
    ? "linear-gradient(to right, #c8a0b8, #a0b8d8)"
    : "linear-gradient(to left, #d8a0c0, #c090a8)";
}

function submit() {
  const birth = document.getElementById("birthInput").value;
  if (!birth) { alert("生年月日を入力してください"); return; }
  try { localStorage.setItem("echo_birth", birth); } catch {}

  const bio = calcBio(birth);
  const moon = getMoon();
  const mode = getMode(bio);
  const m = MODES[mode];
  const lyr = LYRICS[mode];
  const today = new Date();
  const dateStr = `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;

  document.getElementById("moonEmoji").textContent = moon.e;
  document.getElementById("moonName").textContent = moon.n;
  document.getElementById("moonDate").textContent = dateStr;
  document.getElementById("moonMsg").textContent = moon.m;

  document.getElementById("lifeNum").textContent = calcLife(birth);
  document.getElementById("todayNum").textContent = getTodayNum();

  setBioBar("bioPhysical", "bioP", bio.physical);
  setBioBar("bioEmotional", "bioE", bio.emotional);
  setBioBar("bioIntellectual", "bioI", bio.intellectual);

  // キャラ
  document.getElementById("charaImg").src = m.img;
  document.getElementById("charaImg").alt = m.artist;
  document.getElementById("charaBadge").textContent = m.label;
  document.getElementById("charaBadge").style.background = m.color;
  document.getElementById("charaName").textContent = m.artist;
  document.getElementById("charaMsg").textContent = m.msg;

  document.getElementById("lyricSong").textContent = "♪ " + lyr.title;
  document.getElementById("lyricText").textContent = lyr.lines;
  document.getElementById("lyricSig").textContent = "— " + m.artist;

  document.getElementById("birthSection").style.display = "none";
  document.getElementById("result").style.display = "block";
}

function reset() {
  document.getElementById("birthSection").style.display = "block";
  document.getElementById("result").style.display = "none";
}

window.onload = function() {
  try {
    const saved = localStorage.getItem("echo_birth");
    if (saved) { document.getElementById("birthInput").value = saved; submit(); }
  } catch {}
};
</script>
</body>
</html>
