document.getElementById('hdr-count').textContent = `片山佳光 × Luna — 思想の全記録（${PAPERS.length}本）`;

// テーマ一覧
const allThemes = ["すべて",...[...new Set(PAPERS.flatMap(p=>p.themes||[]))].sort()];
const filtersEl = document.getElementById('filters');
allThemes.slice(0,22).forEach(t=>{
  const b=document.createElement('button');
  b.className='filter-btn'+(t==='すべて'?' active':'');
  b.textContent=t;
  b.onclick=()=>{document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()};
  filtersEl.appendChild(b);
});

function getActive(){return document.querySelector('.filter-btn.active')?.textContent||'すべて'}

function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const theme=getActive();
  const filtered=PAPERS.filter(p=>{
    const ms=!q||p.title?.toLowerCase().includes(q)||p.abstract?.toLowerCase().includes(q)||(p.themes||[]).some(t=>t.toLowerCase().includes(q));
    const mt=theme==='すべて'||(p.themes||[]).includes(theme);
    return ms&&mt;
  });
  document.getElementById('count').textContent=`${filtered.length}件表示`;
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  filtered.forEach(p=>{
    const c=document.createElement('div');
    c.className='card';
    const tags=(p.themes||[]).slice(0,3).map(t=>{
      const col=tc(t);
      return `<span class="tag" style="background:${col}22;color:${col};border:1px solid ${col}44">${t}</span>`;
    }).join('');
    c.innerHTML=`<div class="tags">${tags}</div>
      <h3>${p.title}</h3>
      ${p.subtitle?`<p class="sub">${p.subtitle}</p>`:''}
      <p class="abs">${p.abstract}</p>
      ${p.doi?`<p class="doi">DOI: ${p.doi}</p>`:''}`;
    c.onclick=()=>openModal(p);
    grid.appendChild(c);
  });
}

function openModal(p){
  const col=t=>tc(t);
  document.getElementById('m-tags').innerHTML=(p.themes||[]).map(t=>`<span class="tag" style="background:${col(t)}22;color:${col(t)};border:1px solid ${col(t)}44">${t}</span>`).join('');
  document.getElementById('m-title').textContent=p.title;
  document.getElementById('m-sub').textContent=p.subtitle||'';
  const absEl=document.getElementById('m-abs');
  if(p.abstract&&p.abstract!=='（Zenodo登録論文）'){absEl.textContent=p.abstract;absEl.style.display=''}else{absEl.style.display='none'}
  const phrases=document.getElementById('m-phrases');
  if(p.core_phrases&&p.core_phrases.length>0){
    phrases.classList.remove('hidden');
    document.getElementById('m-pills').innerHTML=p.core_phrases.map(x=>`<span class="pill">${x}</span>`).join('');
  }else{phrases.classList.add('hidden')}
  document.getElementById('m-doi').textContent=p.doi?`📌 DOI: ${p.doi}`:'';
  const link=document.getElementById('m-link');
  if(p.url){link.href=p.url;link.style.display='inline-block'}else{link.style.display='none'}
  document.getElementById('overlay').classList.add('open');
}

function closeModal(e){if(e.target===document.getElementById('overlay'))document.getElementById('overlay').classList.remove('open')}

document.getElementById('search').addEventListener('input',render);
render();
</script>
