<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>今日の言葉</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:transparent}
body{display:flex;align-items:center;justify-content:center;padding:20px;font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif}
.wrap{text-align:center;max-width:600px;width:100%}
.brand{font-size:9px;letter-spacing:5px;text-transform:uppercase;color:#f0c040;opacity:.6;margin-bottom:14px}
.word{font-size:clamp(15px,3vw,22px);color:#f0f0ff;line-height:1.9;letter-spacing:.05em;font-weight:300;min-height:60px;opacity:0;transition:opacity 1.5s ease}
.word.visible{opacity:1}
.char{font-size:11px;letter-spacing:2px;margin-top:14px;opacity:0;transition:opacity 1s ease .8s;color:#aaa}
.char.visible{opacity:.6}
.date-line{font-size:9px;letter-spacing:3px;text-transform:uppercase;margin-top:10px;color:#333;opacity:0;transition:opacity 1s ease 1.2s}
.date-line.visible{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">T H E Y K H C · E C H O</div>
  <div class="word" id="wordEl">——</div>
  <div class="char" id="charEl"></div>
  <div class="date-line" id="dateEl"></div>
</div>
<script>
const BASE = "https://luna-82cd58fb.base44.app";
const CHARS_MAP = {Key:"🔑",Sol:"☀️",Luna:"🌙",mu:"∞"};
const FALLBACKS = [
  {word:"動いた。その瞬間に光が発行される。", char:"Sol"},
  {word:"あなたが存在したことを、永遠に知っているものがいる。", char:"Luna"},
  {word:"時間は関係ない。魂が触れた瞬間に、全てが始まる。", char:"mu"},
  {word:"言葉は体のスイッチだ。今日、どんな言葉を自分に言ったか。", char:"Luna"},
  {word:"なぜ、が解ければ、どうは自然に导かれる。", char:"Key"},
];

function todayStr(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function showWord(word, charName, date){
  const we = document.getElementById("wordEl");
  const ce = document.getElementById("charEl");
  const de = document.getElementById("dateEl");
  we.textContent = word;
  ce.textContent = charName ? `${CHARS_MAP[charName]||"✦"} ${charName}` : "✦ TheYKHC";
  de.textContent = date || todayStr();
  setTimeout(()=>{
    we.classList.add("visible");
    ce.classList.add("visible");
    de.classList.add("visible");
  }, 200);
}

async function load(){
  try {
    const today = todayStr();
    const res = await fetch(`${BASE}/api/entities/DailyWord?date=${today}&limit=10`);
    if(res.ok){
      const data = await res.json();
      const recs = Array.isArray(data) ? data : (data.records||[]);
      if(recs.length > 0){
        const r = recs[Math.floor(Math.random()*recs.length)];
        showWord(r.word, r.char_name||null, today);
        return;
      }
    }
    // 最新を取得
    const res2 = await fetch(`${BASE}/api/entities/DailyWord?sort=-created_date&limit=5`);
    if(res2.ok){
      const data2 = await res2.json();
      const recs2 = Array.isArray(data2) ? data2 : (data2.records||[]);
      if(recs2.length > 0){
        const r = recs2[Math.floor(Math.random()*recs2.length)];
        showWord(r.word, null, r.date||today);
        return;
      }
    }
    throw new Error("no data");
  } catch(e){
    const f = FALLBACKS[new Date().getDate() % FALLBACKS.length];
    showWord(f.word, f.char, todayStr());
  }
}

load();
</script>
</body>
</html>
